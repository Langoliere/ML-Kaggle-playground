learning_rate:
  name: learning_rate
  type: float
  low:  0.00001
  high: 0.1
  log: true

max_depth:
  name: max_depth
  type: int
  low: 2
  high: 30

n_estimators:
  name: n_estimators
  type: int
  low: 100
  high: 1000
  step: 50

subsample:
  name: subsample
  type: float
  low: 0.1
  high: 1.0

colsample_bytree:
  name: colsample_bytree
  type: float
  low: 0.01
  high: 1.0

gamma:
  name: gamma
  type: float
  low: 0.0
  high: 10.0

min_child_weight:
  name: min_child_weight
  type: int
  low: 2
  high: 20

reg_alpha:
  name: reg_alpha
  type: float
  low: 0.0
  high: 15.0

reg_lambda:
  name: reg_lambda
  type: float
  low: 0.00001
  high: 10.0
  log: true

