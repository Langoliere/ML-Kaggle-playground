[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "binary_classification_bank"
version = "0.0.1"
description = "Projeck from Kaggle Playground"
authors = [
  { name = "Langoliere" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License"
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["binary_classification_bank"]
include = ["pyproject.toml", "binary_classification_bank/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["binary_classification_bank"]
force-sort-within-sections = true

